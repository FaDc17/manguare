name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Recorrido offline → enviada → recibida
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chrome para Puppeteer
        run: |
          CHROME_PATH=$(npx @puppeteer/browsers install chrome@stable --path .chrome | tail -n 1)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t manguare:ci .
