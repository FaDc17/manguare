services:
  manguare:
    build: .
    image: manguare:local
    ports:
      - "8787:8787"
    environment:
      # Obligatoria: el panel no debe quedar abierto en una red compartida.
      MANGUARE_PANEL_PASSWORD: ${MANGUARE_PANEL_PASSWORD:?define MANGUARE_PANEL_PASSWORD en .env}
      MANGUARE_PANEL_USER: ${MANGUARE_PANEL_USER:-salud}
      # Fija un secreto largo para que las sesiones sobrevivan a reinicios.
      MANGUARE_SESSION_SECRET: ${MANGUARE_SESSION_SECRET:-}
      MANGUARE_SESSION_HOURS: ${MANGUARE_SESSION_HOURS:-12}
      # Actívalos si publicas detrás de HTTPS y un proxy inverso.
      MANGUARE_SECURE_COOKIES: ${MANGUARE_SECURE_COOKIES:-0}
      MANGUARE_TRUST_PROXY: ${MANGUARE_TRUST_PROXY:-0}
    volumes:
      - manguare-data:/data
    restart: unless-stopped

volumes:
  manguare-data:
